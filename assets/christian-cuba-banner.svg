<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Christian Cuba — Building Ajedrez Nexus</title>
  <desc id="desc">Purple and lime identity banner for Christian Cuba, creator of Ajedrez Nexus, with an original four-square geometric mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1e1734"/><stop offset="1" stop-color="#3d2a61"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#b5a1ed" stop-opacity=".16"/><stop offset="1" stop-color="#b5a1ed" stop-opacity="0"/></radialGradient>
    <linearGradient id="shine"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".44"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="markClip"><rect x="-88" y="-88" width="78" height="78" rx="15"/><rect x="2" y="-88" width="78" height="78" rx="15"/><rect x="-88" y="2" width="78" height="78" rx="15"/><rect x="2" y="2" width="78" height="78" rx="15"/></clipPath>
    <pattern id="chessBoard" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#e2d7f5" fill-opacity=".065"/><rect x="48" y="48" width="48" height="48" fill="#e2d7f5" fill-opacity=".065"/></pattern>
    <linearGradient id="boardFade"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".65"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="boardMask"><rect x="800" width="480" height="320" fill="url(#boardFade)"/></mask>
    <clipPath id="bannerClip"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <style>
    .brand-motion { transform-origin: 0px 0px; animation: brand-turn 4.8s cubic-bezier(.4,0,.2,1) infinite; }
    .brand-shine { animation: brand-light 4.8s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes brand-turn { 0%,14%,64%,100% { transform: rotate(0deg); } 34% { transform: rotate(3deg); } 48% { transform: rotate(-.7deg); } }
    @keyframes brand-light { 0%,12% { transform: translateX(0); opacity: 0; } 18% { opacity: 1; } 46% { transform: translateX(360px); opacity: 1; } 54%,100% { transform: translateX(360px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .brand-motion { animation: none; } .brand-shine { display: none; animation: none; } }
  </style>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect x="800" width="480" height="320" fill="url(#chessBoard)" mask="url(#boardMask)" clip-path="url(#bannerClip)"/>
  <rect x="1" y="1" width="1278" height="318" rx="23" fill="none" stroke="#bba6ec" stroke-opacity=".18"/>
  <ellipse cx="1050" cy="150" rx="310" ry="240" fill="url(#light)"/>
  <path d="M64 252H796" stroke="#c7b5ed" stroke-opacity=".22"/>
  <rect x="64" y="48" width="5" height="20" rx="2.5" fill="#caff73"/>
  <text x="82" y="63" fill="#d9ccef" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">CHESS · LEARNING · SOFTWARE</text>
  <text x="61" y="139" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Christian Cuba</text>
  <text x="65" y="185" fill="#caff73" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600">Building Ajedrez Nexus</text>
  <text x="65" y="222" fill="#ded5ed" font-family="Arial, Helvetica, sans-serif" font-size="18">Study with purpose. Understand the game.</text>
  <text x="65" y="282" fill="#c6b6dd" font-family="Arial, Helvetica, sans-serif" font-size="15">Estudiar · Practicar · Comprender</text>
  <g transform="translate(1032 151) rotate(-12)">
    <g class="brand-motion">
    <rect x="-88" y="-88" width="78" height="78" rx="15" fill="#caff73"/>
    <rect x="2" y="-88" width="78" height="78" rx="15" fill="#caff73" fill-opacity=".4588235294"/>
    <rect x="-88" y="2" width="78" height="78" rx="15" fill="#b8a9ff"/>
    <rect x="2" y="2" width="78" height="78" rx="15" fill="#caff73" fill-opacity=".1490196078"/>
    <path d="M-69-74h36" stroke="#f0ffd9" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <g clip-path="url(#markClip)"><rect class="brand-shine" x="-196" y="-120" width="64" height="260" transform="skewX(-16)" fill="url(#shine)" opacity="0"/></g>
    </g>
  </g>
  <text x="1028" y="282" text-anchor="middle" fill="#ded1f2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">AJEDREZ NEXUS</text>
</svg>
